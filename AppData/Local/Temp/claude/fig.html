<!doctype html><meta charset=utf-8><body style="margin:20px;background:#ddd">
<figure class="figure">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 486" role="img" aria-labelledby="nft nfd">
<title id="nft">Which parts of Melanotan II are natural and which are engineered</title>
<desc id="nfd">A five-row ledger comparing the body's own alpha-MSH signal with Melanotan II. Only the first row — the signal the molecule is copied from — is shared and natural. The other four rows — the molecule itself, where it acts, how long it lasts, and what it reaches — are all deliberately engineered away from the natural signal. The market's "it's natural" claim describes only the one shared row.</desc>
<rect x="0" y="0" width="820" height="486" fill="#FBFAF7"/>
<rect x="8" y="8" width="804" height="470" rx="10" fill="none" stroke="#E4DFD6"/>
<text x="36" y="44" font-family="'Spectral',Georgia,serif" font-size="21" font-weight="600" fill="#17130E">The one true thing, and the four engineered ones</text>
<text x="36" y="66" font-family="'Archivo',sans-serif" font-size="12.5" fill="#5A4F44">&#8220;It&#8217;s natural &#8212; your body makes this hormone&#8221; describes one row of five. The market sells you that row.</text>
<!-- column headers -->
<text x="182" y="98" font-family="'Archivo',sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8A6A3B">YOUR BODY&#8217;S &#945;-MSH</text>
<text x="182" y="112" font-family="'Archivo',sans-serif" font-size="10.5" font-style="italic" fill="#8A8275">a local whisper</text>
<text x="480" y="98" font-family="'Archivo',sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#503296">MELANOTAN II</text>
<text x="480" y="112" font-family="'Archivo',sans-serif" font-size="10.5" font-style="italic" fill="#8A8275">a body-wide broadcast</text>
<!-- ROW 1: natural -->
<rect x="462" y="126" width="246" height="56" rx="4" fill="#A9754C" fill-opacity="0.08"/>
<rect x="462" y="126" width="4" height="56" rx="2" fill="#A9754C"/>
<text x="36" y="150" font-family="'Archivo',sans-serif" font-size="12.5" font-weight="600" fill="#17130E">The signal it copies</text>
<text x="36" y="167" font-family="'Archivo',sans-serif" font-size="10.5" fill="#8A8275">what it is based on</text>
<text x="182" y="159" font-family="'Archivo',sans-serif" font-size="12" fill="#5A4F44">&#945;-MSH, a 13-amino-acid hormone</text>
<text x="480" y="159" font-family="'Archivo',sans-serif" font-size="12" fill="#17130E">The same &#945;-MSH, as its template</text>
<text x="800" y="158" text-anchor="end" font-family="'Archivo',sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.4" fill="#8A6A3B">NATURAL</text>
<!-- ROW 2 -->
<rect x="462" y="190" width="246" height="56" rx="4" fill="#503296" fill-opacity="0.07"/>
<rect x="462" y="190" width="4" height="56" rx="2" fill="#503296"/>
<text x="36" y="214" font-family="'Archivo',sans-serif" font-size="12.5" font-weight="600" fill="#17130E">The molecule</text>
<text x="182" y="223" font-family="'Archivo',sans-serif" font-size="12" fill="#5A4F44">Left intact</text>
<text x="480" y="223" font-family="'Archivo',sans-serif" font-size="12" fill="#17130E">Re-cut: Nle&#8308;, D-Phe&#8311;, a cyclic ring</text>
<!-- ROW 3 -->
<rect x="462" y="254" width="246" height="56" rx="4" fill="#503296" fill-opacity="0.07"/>
<rect x="462" y="254" width="4" height="56" rx="2" fill="#503296"/>
<text x="36" y="278" font-family="'Archivo',sans-serif" font-size="12.5" font-weight="600" fill="#17130E">Where it acts</text>
<text x="182" y="287" font-family="'Archivo',sans-serif" font-size="12" fill="#5A4F44">Made in the skin, where it&#8217;s needed</text>
<text x="480" y="287" font-family="'Archivo',sans-serif" font-size="12" fill="#17130E">Injected into the whole bloodstream</text>
<!-- ROW 4 -->
<rect x="462" y="318" width="246" height="56" rx="4" fill="#503296" fill-opacity="0.07"/>
<rect x="462" y="318" width="4" height="56" rx="2" fill="#503296"/>
<text x="36" y="342" font-family="'Archivo',sans-serif" font-size="12.5" font-weight="600" fill="#17130E">How long it lasts</text>
<text x="182" y="351" font-family="'Archivo',sans-serif" font-size="12" fill="#5A4F44">Minutes, then enzymes erase it</text>
<text x="480" y="351" font-family="'Archivo',sans-serif" font-size="12" fill="#17130E">Hours &#8212; built to resist breakdown</text>
<!-- ROW 5 -->
<rect x="462" y="382" width="246" height="56" rx="4" fill="#503296" fill-opacity="0.07"/>
<rect x="462" y="382" width="4" height="56" rx="2" fill="#503296"/>
<text x="36" y="406" font-family="'Archivo',sans-serif" font-size="12.5" font-weight="600" fill="#17130E">What it reaches</text>
<text x="182" y="415" font-family="'Archivo',sans-serif" font-size="12" fill="#5A4F44">The pigment cells next door</text>
<text x="480" y="415" font-family="'Archivo',sans-serif" font-size="12" fill="#17130E">Every receptor, the brain included</text>
<!-- engineered brace + label for rows 2-5 -->
<path d="M796 192 q6 0 6 8 v112 q0 8 6 8 q-6 0 -6 8 v112 q0 8 -6 8" fill="none" stroke="#503296" stroke-width="1.2" stroke-opacity="0.55" transform="translate(-2,0)"/>
<text x="806" y="314" font-family="'Archivo',sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#503296" transform="rotate(90 806 314)" text-anchor="middle">FOUR EDITS &#183; ENGINEERED</text>
<!-- footer -->
<line x1="36" y1="452" x2="784" y2="452" stroke="#EDE7DE" stroke-width="1"/>
<text x="36" y="470" font-family="'Spectral',Georgia,serif" font-size="13" font-weight="600" fill="#17130E">4 of 5 engineered</text>
<text x="784" y="470" text-anchor="end" font-family="'Archivo',sans-serif" font-size="10" font-style="italic" fill="#8A8275">warm = the body&#8217;s design &#183; purple = the lab&#8217;s</text>
</svg>
<figcaption>Five things decide what the molecule does in a body; only the first &mdash; the hormone it is patterned on &mdash; is natural. The molecule, the route, the duration, and the reach were each engineered away from the signal the market says it merely supplements.</figcaption>
</figure>
</body>
