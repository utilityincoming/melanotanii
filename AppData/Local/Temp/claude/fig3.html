<title id="pit">Why a gray-market dosing protocol cannot work</title>
<desc id="pid">A dosing protocol in a regulated medicine is a contract with three parties: a verified label, measured pharmacology, and a licensed prescriber. The diagram shows that a gray-market Melanotan II guide borrows the vocabulary of all three but supplies none: the label is a "not for human consumption" disclaimer, the pharmacology is forum anecdote, and the prescriber is a stranger in a reply thread. A closing note records that when a regulator tested five labelled bottles, the real content varied by more than double.</desc>
<rect x="0" y="0" width="820" height="462" fill="#FBFAF7"/>
<rect x="8" y="8" width="804" height="446" rx="10" fill="none" stroke="#E4DFD6"/>
<text x="36" y="44" font-family="'Spectral',Georgia,serif" font-size="21" font-weight="600" fill="#17130E">A protocol is a contract with three parties</text>
<text x="36" y="66" font-family="'Archivo',sans-serif" font-size="12.5" fill="#5A4F44">A real medicine supplies all three. The gray-market guide borrows their vocabulary and supplies none.</text>
<!-- column headers -->
<text x="341" y="98" text-anchor="middle" font-family="'Archivo',sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#8A6A3B">WHAT A REAL PROTOCOL HAS</text>
<text x="641" y="98" text-anchor="middle" font-family="'Archivo',sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#A6431F">WHAT THE GUIDE SUPPLIES</text>

<text x="36" y="140" font-family="'Archivo',sans-serif" font-size="12.5" font-weight="600" fill="#17130E">The label</text>
<text x="36" y="157" font-family="'Archivo',sans-serif" font-size="10.5" fill="#8A8275">what&#8217;s in the vial</text>

<rect x="36" y="330" width="748" height="46" rx="6" fill="#17130E" fill-opacity="0.045"/>
<text x="410" y="359" text-anchor="middle" font-family="'Spectral',Georgia,serif" font-size="16" font-weight="600" fill="#17130E">The arithmetic is real. The premises are fiction.</text>
<!-- TGA note -->
<line x1="36" y1="398" x2="784" y2="398" stroke="#EDE7DE" stroke-width="1"/>
<text x="410" y="420" text-anchor="middle" font-family="'Archivo',sans-serif" font-size="10.5" font-style="italic" fill="#8A8275">When a regulator tested five labelled bottles, the real content varied by more than double. &#8212; TGA, Aug 2026</text>
</svg>
<figcaption>A dosing protocol is not a number; it is a contract between a verified label, a measured pharmacology, and a licensed prescriber. The gray-market guide keeps the format and supplies none of the three &mdash; which is why the titration math is precision applied to a guess.</figcaption>
